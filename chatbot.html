<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>

        body {
          font-family: Arial, sans-serif;
          margin-top: 0px;
          margin-bottom: 0px;
        }

        .send-button {
          background-color: #19b819;
          color: white;
          padding: 12px 20px;
          margin-left: 10px;
          border: none;
          border-radius: 10px;
          font-size: 15px;
          cursor: pointer;
        }

        .chat-input {
          padding: 12px 15px;
          border: 1px solid #ccc;
          border-radius: 10px;
          font-size: 15px;
          flex-grow: 1;
        }

        .chat-input-container {
          display: flex;
          align-items: center;
          margin-bottom: 60px;
        }

        .app-container {
          max-width: 600px;
          margin-left: auto;
          margin-right: auto;

          height: 100vh;
          display: flex;
          flex-direction: column;        
        }

        .chat-message-robot {
          display: flex;
          justify-content: flex-start;
          padding: 10px;
          align-items: start;
          /* background-color: #f1f1f1; */
          /* border-radius: 10px; */
          margin-bottom: 10px;
        }

        .chat-message-user {
          display: flex;
          justify-content: flex-end;
          padding: 10px;
          align-items: start;
          /* border-radius: 10px; */
          /* background-color: #d1e7dd; */
          margin-bottom: 10px;
        }

        .chat-message-text {
          background-color: #f1f1f1;
          border-radius: 10px;
          padding: 10px;
          margin: 0 10px;
          max-width: 70%;
        }

        .chat-message-avatar {
          width: 45px;
          margin-right: 10px;
        }

        .chat-messages-container {
          flex-grow: 1;
          overflow-y: auto;
          padding: 10px;
          margin-top: 10px;
          overflow: scroll;
          scrollbar-width: none;
        }

        .chat-message-empty {
          text-align: center;
          color: #888;
          margin-top: 20px;
        }
    </style>

  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {

          const [inputText, setInputText] = React.useState('');

          function saveInputText(event){
            const inputText = event.target.value;
            setInputText(inputText);

          }

          async function sendMessage() {

            const newChatMessages = [
              ...chatMessages,
              {
                message: inputText,
                sender: "user"
              }
            ];

            setChatMessages(newChatMessages);

            const response = await Chatbot.getResponseAsync(inputText);

            {/* display spanner when loading response from robot */}
              setChatMessages([
                ...newChatMessages,
                {
                  message: '<img src="images/loading-spinner.gif"  />',
                  sender: 'robot'
                }
              ]);

             setChatMessages([
              ...newChatMessages,
              {
                message: response,
                sender: "robot"
              }
            ]);


            setInputText('');
          }
          
          function handleKeyDown(event) {
            if (event.key === 'Enter') {
              sendMessage();
            }
            if(event.key === 'Escape') {
              setInputText('');
            }
          }

          return (
            <div className="chat-input-container">
              <input 
                type="text" 
                placeholder="Send a message to chatbot..." 
                size="30" 
                onChange= {saveInputText}
                value={inputText}
                onKeyDown= {handleKeyDown}
                className="chat-input"
              />
              <button 
                onClick={sendMessage}
                className="send-button"
                >
                Send
              </button>
            </div>
          );
        }

        function ChatMessage({ message, sender }) {

        //   const { message, sender } = props;
            return (
                <div className={`chat-message-${sender}`}>
                    { sender === "robot" && (
                        <img src={`images/${sender}.png`} 
                        alt={sender} 
                        className="chat-message-avatar"
                        />
                    )}
                    <div className="chat-message-text">                    
         
                      {message}
                    </div>
                    { sender === "user" && (
                        <img src={`images/${sender}.png`}
                        alt={sender} 
                        className="chat-message-avatar"
                        />
                    )}
                </div>
            );
        }

        function ChatMessages({ chatMessages }) {

          const containerRef = React.useRef(null);

          React.useEffect(() => {

            const container = containerRef.current;

            if (container) {
              container.scrollTop = container.scrollHeight;
            }
          },[chatMessages]);

          return (
            <div className="chat-messages-container"
              ref={containerRef}>
              {chatMessages.length === 0 && (
                <div className="chat-message-empty">
                  No messages yet.
                </div>
              )}
              {chatMessages.map((chat, index) => (
                <ChatMessage 
                  key={index}
                  message={chat.message} 
                  sender={chat.sender} 
                />
              ))}
            </div>
          );
        }

        function App() {      

          const [chatMessages, setChatMessages] = React.useState([]);

        return (
            <div className="app-container">
              <ChatMessages chatMessages={chatMessages} /> 
              <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
            </div>
          );
        }

       
        // Get the container element where the chatbot will be rendered

        const container = document.querySelector('.js-container');
     
        ReactDOM.createRoot(container).render(
          <App />
        );
    </script>
  </body>
</html>
